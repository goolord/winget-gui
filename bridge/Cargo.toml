[package]
name = "winget-bridge"
version = "0.1.0"
edition = "2024"
publish = false
description = "C ABI over the WinGet COM API (Microsoft.Management.Deployment) for the Haskell GUI"

[lib]
name = "winget_bridge"
# A static library: the Rust code and its dependencies are linked into the
# executables, so a release ships no winget_bridge.dll. It is built for the
# gnullvm target, whose ABI matches the toolchain GHC links with (clang, lld,
# compiler-rt, UCRT); see build/Build.hs.
crate-type = ["staticlib"]

[dependencies]
windows-core = "0.100"
windows-collections = "0.100"
windows-future = "0.100"
windows-reference = "0.100"
windows-time = "0.100"
windows-link = "0.100"
windows-registry = "0.100"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
